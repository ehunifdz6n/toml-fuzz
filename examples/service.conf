# service.conf - example input for `make smoke` and a starting corpus seed.
# Deploy settings for a fictional log shipper.

[server]
listen = "127.0.0.1:8080"
workers = 4
debug = false
allowed_hosts = ["localhost", "127.0.0.1", "logs.internal"]

[shipper]
batch_size = 512
flush_ms = 250
compression = "gzip"

[shipper.retry]
max_attempts = 5
backoff_ms = 100

# trailing comment, no newline after this line
